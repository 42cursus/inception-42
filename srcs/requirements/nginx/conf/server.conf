server {
    listen         80 default_server;
    listen         [::]:80 default_server;
    server_name    _;

    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self';"             always;
    return         301 https://$host$request_uri;
}

# noinspection NginxSecurityHeadersInspection
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name abelov.42.fr;

    ssl_certificate /etc/ssl/abelov.42.fr.crt;
    ssl_certificate_key /etc/ssl/private/abelov.42.fr.key;

    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html index.htm;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # to prevent return 404 recursion.
    location = /404.html {
        internal;
    }
}
