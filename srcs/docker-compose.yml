services:

  mariadb:
    container_name: mariadb
    image: mariadb:42
    build: requirements/mariadb
    restart: always
    env_file: .env
    environment:
      DB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_DATABASE: ${DB_NAME}
    volumes:
      - mariadb:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception

  wordpress:
    container_name: wordpress
    image: wordpress:42
    build: requirements/wordpress
    restart: always
    env_file: .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    volumes:
      - wordpress:/var/www/html
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    image: nginx:42
    build: requirements/nginx
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    depends_on:
      - wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/abelov/data/wordpress
      o: bind
      type: none
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/abelov/data/mariadb
      o: bind
      type: none

networks:
  inception:
    driver: bridge
    name: inception
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/24
